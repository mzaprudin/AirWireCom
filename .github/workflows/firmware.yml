name: Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/readme/**'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/readme/**'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test firmware state and protocol handling
        run: python tests/run_host_tests.py
      - name: Test UART measurement tool
        run: python -m unittest discover -s scripts -p 'test_*.py'

  build:
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: espressif32
            environments: -e s2mini -e s2mini_debug -e esp32 -e esp32_debug
          - platform: espressif8266
            environments: -e esp8266 -e esp8266_debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore PlatformIO toolchain
        id: pio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-v2-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build release and debug firmware
        run: pio run ${{ matrix.environments }}
      - name: Save PlatformIO toolchain
        if: github.ref == 'refs/heads/main' && steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.platform }}
          retention-days: 7
          path: |
            .pio/build/**/*.bin
            .pio/build/**/*.elf
          if-no-files-found: error
