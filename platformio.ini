; AirWireCom: the same firmware handles both roles.
; Select a board environment; choose serial ports locally with --upload-port / --port.

[env]
framework     = arduino
lib_deps      =
    gyverlibs/EncButton@3.7.6
    gyverlibs/GyverIO@1.4.2
upload_speed  = 921600
monitor_speed = 115200

; ESP32-S2 Mini: native USB CDC
[env:s2mini]
platform      = platformio/espressif32@6.12.0
board         = lolin_s2_mini
build_flags   =
    -Isrc
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"

[env:s2mini_debug]
platform      = platformio/espressif32@6.12.0
board         = lolin_s2_mini
build_flags   =
    -Isrc
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
    -DDEBUG

; Classic ESP32: external USB-UART adapter
[env:esp32]
platform      = platformio/espressif32@6.12.0
board         = esp32dev

[env:esp32_debug]
platform      = platformio/espressif32@6.12.0
board         = esp32dev
build_flags   = -DDEBUG

; ESP8266 NodeMCU
[env:esp8266]
platform      = platformio/espressif8266@4.2.1
board         = nodemcuv2

[env:esp8266_debug]
platform      = platformio/espressif8266@4.2.1
board         = nodemcuv2
build_flags   = -DDEBUG
